<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Andy's Factory - 3D Horror</title>
    <!-- Links safely to your custom style properties -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="ui">
        <h1>ANDY'S FACTORY</h1>
        <div id="stats">Batteries: <span id="score">0</span>/3 | Escape Level: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="instructions">
        W,A,S,D to move/strafe. Move mouse to look around.<br>
        Left-Click the screen to lock your mouse. Left-Click again to FIRE weapon.<br>
        <strong>Press SPACEBAR to Start / Restart / Go to Next Level.</strong>
    </div>

    <!-- Links perfectly to your JavaScript code below -->
    <script src="game.js"></script>
</body>
</html>
